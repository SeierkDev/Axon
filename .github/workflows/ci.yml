name: CI

on:
  push:
    branches: ["**"]
    # The autonomy pass commits its log on every run. Those commits touch
    # nothing but JSON under autonomy/ and cannot affect the build, so running
    # the full suite on them doubles CI for no information.
    paths-ignore:
      - "autonomy/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        run: npm ci --prefix packages/sdk

      # The CLI has its own dependency tree. Without this the TypeCheck step
      # below fails: packages/cli/src imports bs58, which falls back to the
      # root's untyped v4 and trips noImplicitAny.
      - name: Install CLI dependencies
        run: npm ci --prefix packages/cli

      - name: TypeCheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          DATABASE_PATH: ":memory:"
          NODE_ENV: test
          LOG_LEVEL: error
          SEED_SECRET: ci_seed_secret_that_is_at_least_32_chars_long

      - name: Build SDK
        run: npm run build --prefix packages/sdk

      # Bundles the published binary, so a break in it fails here rather than
      # at publish time.
      - name: Build CLI
        run: npm run build --prefix packages/cli
