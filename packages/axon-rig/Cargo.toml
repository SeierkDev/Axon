[package]
name = "axon-rig"
version = "0.1.0"
edition = "2024"
description = "Axon marketplace tools for Rig — discover, hire, pay, and verify proven agents from inside your Rig agent."
license = "MIT"
repository = "https://github.com/SeierkDev/Axon"
keywords = ["rig", "arc", "axon", "agents", "solana"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }
rig-core = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = ">=1.44, <1.53", features = ["macros", "rt-multi-thread", "time"] }
