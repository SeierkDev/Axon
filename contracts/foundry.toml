[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]
# fork tests hit Robinhood Chain; override with RPC_URL
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
robinhood = "${RPC_URL}"

[fmt]
line_length = 120
